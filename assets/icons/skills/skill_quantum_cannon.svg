<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Heavy Dual Railgun Barrels Pointing Up -->
  <!-- Left Barrel -->
  <rect x="170" y="90" width="50" height="270" rx="8" fill="#ffffff"/>
  <!-- Right Barrel -->
  <rect x="292" y="90" width="50" height="270" rx="8" fill="#ffffff"/>
  <!-- Electromagnetic Accelerator Rings -->
  <rect x="140" y="130" width="232" height="34" rx="8" fill="#ffffff"/>
  <rect x="140" y="200" width="232" height="34" rx="8" fill="#ffffff"/>
  <rect x="140" y="270" width="232" height="34" rx="8" fill="#ffffff"/>
  <!-- Negative Core Beam Channel -->
  <line x1="256" y1="90" x2="256" y2="340" stroke="#000000" stroke-width="32"/>
  <!-- Base Breech / Receiver Block -->
  <path fill="#ffffff" d="M120 340 L392 340 L420 460 L92 460 Z"/>
  <rect x="220" y="370" width="72" height="50" rx="6" fill="#000000"/>
  <!-- Muzzle Blast Ring & Spikes at Top -->
  <polygon points="256,16 280,70 232,70" fill="#ffffff"/>
  <polygon points="195,30 210,80 180,80" fill="#ffffff"/>
  <polygon points="317,30 332,80 302,80" fill="#ffffff"/>
