<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Left Solar Panel -->
  <rect x="4" y="24" width="16" height="16" rx="2" fill="#0077B6" stroke="#00F0FF" stroke-width="2"/>
  <line x1="12" y1="24" x2="12" y2="40" stroke="#00F0FF" stroke-width="1.5"/>
  <line x1="4" y1="32" x2="20" y2="32" stroke="#00F0FF" stroke-width="1.5"/>
  <!-- Left Joint -->
  <line x1="20" y1="32" x2="26" y2="32" stroke="#00F0FF" stroke-width="3"/>
  <!-- Main Core Body -->
  <rect x="26" y="22" width="12" height="20" rx="3" fill="#0A1828" stroke="#00F0FF" stroke-width="2"/>
  <circle cx="32" cy="32" r="3" fill="#00FF9D"/>
  <!-- Right Joint -->
  <line x1="38" y1="32" x2="44" y2="32" stroke="#00F0FF" stroke-width="3"/>
  <!-- Right Solar Panel -->
  <rect x="44" y="24" width="16" height="16" rx="2" fill="#0077B6" stroke="#00F0FF" stroke-width="2"/>
  <line x1="52" y1="24" x2="52" y2="40" stroke="#00F0FF" stroke-width="1.5"/>
  <line x1="44" y1="32" x2="60" y2="32" stroke="#00F0FF" stroke-width="1.5"/>
  <!-- Antenna & Dish -->
  <line x1="32" y1="22" x2="32" y2="12" stroke="#00F0FF" stroke-width="2"/>
  <path d="M26 12 Q32 16 38 12" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="32" cy="8" r="2" fill="#FFFFFF"/>
  <!-- Broadcast Signal Arcs -->
  <path d="M24 6 Q32 1 40 6" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
</svg>
